services:
  x-transcript:
    build: .
    image: x-transcript-mcp:latest
    container_name: x-transcript-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      # UID/GID de l'hôte propriétaires de ./data et ./cookies (décommentez si besoin)
      # PUID: "1000"
      # PGID: "1000"
    ports:
      # Publié sur 127.0.0.1 par défaut : seul le reverse proxy local y accède.
      # Mettez BIND_ADDRESS=0.0.0.0 dans .env si le proxy est sur une autre machine.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:${PORT:-8000}"
    volumes:
      - ./data:/data              # cache SQLite + fichiers temporaires
      - ./cookies:/cookies:ro     # optionnel : cookies.txt pour yt-dlp (COOKIES_PATH=/cookies/cookies.txt)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
